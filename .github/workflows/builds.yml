name: Build GDExtension
on:
  push:
  pull_request:
  merge_group:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            { platform: linux,   arch: x86_64, os: ubuntu-22.04  },
            { platform: windows, arch: x86_64, os: windows-latest },
          ]
        target-type: [template_debug, template_release]

    runs-on: ${{ matrix.target.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux - build
        if: ${{ matrix.target.platform == 'linux' }}
        shell: bash
        run: |
          sudo apt-get install -y clang
          if [ "${{ matrix.target-type }}" = "template_release" ]; then
            BUILD_RELEASE=yes ./build.sh
          else
            ./build.sh
          fi

      - name: Windows - build
        if: ${{ matrix.target.platform == 'windows' }}
        shell: cmd
        run: |
          if "${{ matrix.target-type }}"=="template_release" (
            cmd /c "set BUILD_RELEASE=YES && call build_windows.cmd"
          ) else (
            cmd /c call "build_windows.cmd"
          )

      - name: Windows - delete intermediate files
        if: ${{ matrix.target.platform == 'windows' }}
        shell: pwsh
        run: |
          Remove-Item bin/* -Include *.exp,*.lib,*.pdb -Recurse -Force -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-hesai-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.target-type }}
          path: ${{ github.workspace }}/bin/**
